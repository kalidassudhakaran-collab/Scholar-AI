<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Scholar AI</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/motion.css" />
</head>
<body>
  <div class="bg-motion" aria-hidden="true">
    <div class="grid-glow"></div>
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="blob blob-4"></span>
  </div>
  <div class="auth-page">
    <div class="card">
      <h1>Create account</h1>
      <p class="desc" style="margin-bottom: 1.25rem">Start using Scholar AI for free</p>
      <p id="error" class="error" hidden></p>
      <form id="form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="password2">Confirm password</label>
          <input type="password" id="password2" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%">Register</button>
      </form>
      <p class="auth-sub">
        Have an account? <a href="/login.html">Sign in</a>
      </p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById("error");
      err.hidden = true;
      const p1 = document.getElementById("password").value;
      const p2 = document.getElementById("password2").value;
      if (p1 !== p2) {
        err.textContent = "Passwords do not match";
        err.hidden = false;
        return;
      }
      try {
        const res = await fetch("/api/auth/register/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            username: document.getElementById("username").value,
            password: p1,
            password_confirm: p2,
          }),
        });
        if (!res.ok) throw new Error("Registration failed");
        const data = await res.json();
        setTokens(data.access, data.refresh);
        location.href = "/dashboard.html";
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
      }
    };
  </script>
</body>
</html>
